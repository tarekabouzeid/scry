apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-scry-migrate-{{ .Release.Revision }}
  labels:
    {{- include "scry.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: "{{ .Values.image.registry }}/scry-api:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "node_modules/@scry/db/dist/migrate.js"]
          envFrom:
            - configMapRef:
                name: {{ include "scry.fullname" . }}-config
            - secretRef:
                name: {{ include "scry.secretName" . }}
