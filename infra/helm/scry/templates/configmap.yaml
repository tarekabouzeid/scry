apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "scry.fullname" . }}-config
  labels:
    {{- include "scry.labels" . | nindent 4 }}
data:
  API_PORT: {{ .Values.api.port | quote }}
  WEB_PORT: {{ .Values.web.port | quote }}
  {{- if .Values.ingress.enabled }}
  # The browser calls this directly — it must be the externally reachable
  # API host, not the in-cluster service DNS name.
  NEXT_PUBLIC_API_URL: {{ printf "https://%s" .Values.ingress.apiHost | quote }}
  WEB_ORIGIN: {{ printf "https://%s" .Values.ingress.webHost | quote }}
  {{- else }}
  NEXT_PUBLIC_API_URL: "http://localhost:3001"
  WEB_ORIGIN: "http://localhost:3000"
  {{- end }}
  {{- if .Values.postgres.enabled }}
  DATABASE_URL: {{ printf "postgres://scry:scry@%s-scry-postgres:5432/scry" .Release.Name | quote }}
  {{- end }}
  {{- if .Values.redis.enabled }}
  REDIS_URL: {{ printf "redis://%s-scry-redis:6379" .Release.Name | quote }}
  {{- end }}
  {{- range $key, $value := .Values.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
