# Demo overlay: the full stack with seeded demo data, local Keycloak logins,
# and a bundled offline "demo LLM", so every feature works with no accounts,
# API keys or internet access. See docs/demo.md for the story and logins.
#
# From the repo root:
#   cp .env.keycloak.example .env
#   docker compose -f infra/docker/docker-compose.prod.yml \
#                  -f infra/docker/docker-compose.keycloak.yml \
#                  -f infra/docker/docker-compose.demo.yml up -d --build
#
# Then open http://localhost:3000 and sign in as e.g. alice / alice123.
# Reset to a fresh demo:  add `down -v` to the same command, then `up` again.
#
# SECURITY: the demo ships well-known passwords (alice123, Keycloak admin/admin)
# and a static session secret, so every port is bound to 127.0.0.1 — reachable
# from this machine only. Don't expose a demo stack to a network.
#
# AI is configured in the app, not here: sign in as alice (admin), open
# Admin → AI & models and connect the bundled demo LLM at
# http://demo-llm:4010/v1 (no authentication). Until then the seeded data is
# all there, but Ask Scry, semantic search and overlap detection are off.
# The demo LLM is NOT a language model — deterministic embeddings and
# templated replies (see infra/docker/demo-llm/server.mjs). Point AI & models
# at a real endpoint (e.g. a LiteLLM gateway) for real answers.
name: scry

services:
  demo-llm:
    build:
      context: ./demo-llm
    restart: unless-stopped
    # Auth is off unless .env sets DEMO_LLM_API_KEY and/or DEMO_LLM_JWKS_URL
    # (see docs/demo.md, "Trying the AI auth modes").
    env_file: ../../.env

  # One-shot: loads the demo story into an empty database (skips if data
  # already exists, so restarts never clobber changes you made while testing).
  seed:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    env_file: ../../.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-scry}:${POSTGRES_PASSWORD:-scry}@postgres:5432/${POSTGRES_DB:-scry}
    command: ["node", "node_modules/@scry/db/dist/seed.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    ports: !override
      - "127.0.0.1:${API_PORT:-3001}:3001"
    environment:
      # Inside the compose network the api reaches Keycloak by service name;
      # Keycloak still issues browser-facing URLs for localhost:8080 (see
      # KC_HOSTNAME in docker-compose.keycloak.yml).
      OIDC_ISSUER_URL: http://keycloak:8080/realms/scry
    depends_on:
      demo-llm:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
      keycloak:
        condition: service_started

  web:
    ports: !override
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
