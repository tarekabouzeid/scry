# Full self-hosted stack: Postgres (pgvector), Valkey (Redis), api, web, and a
# one-shot migration step — everything containerized, no local Node/pnpm
# install required. Build context is the monorepo root, so run this from
# the repo root:
#   cp .env.example .env   # fill in SESSION_SECRET, OIDC_*, LLM_BASE_URL
#   docker compose -f infra/docker/docker-compose.prod.yml up -d --build
#
# DATABASE_URL/REDIS_URL in .env are for native `pnpm dev` (host -> published
# ports); the api/migrate services below override them to the in-network
# `postgres`/`redis` service names, so you don't need to edit those for the
# containerized stack to work.
name: scry

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18
    # Parallel index builds (the HNSW vector index) need more than the 64 MB default.
    shm_size: 1g
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scry}
      POSTGRES_DB: ${POSTGRES_DB:-scry}
    volumes:
      # Postgres 18 images keep their data in a versioned folder under here.
      - scry-postgres-data:/var/lib/postgresql
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scry}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    # Valkey: the BSD-licensed, Redis-compatible store (queues, rate limits, caches).
    image: valkey/valkey:9.0-alpine
    restart: unless-stopped
    volumes:
      - scry-redis-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    env_file: ../../.env
    environment:
      # Override the host-oriented DATABASE_URL from .env (used by native
      # `pnpm dev`) — inside the compose network Postgres is reachable at
      # the `postgres` service name, not `localhost`.
      DATABASE_URL: postgres://${POSTGRES_USER:-scry}:${POSTGRES_PASSWORD:-scry}@postgres:5432/${POSTGRES_DB:-scry}
    command: ["node", "node_modules/@scry/db/dist/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: ../../.env
    environment:
      # Same container-networking override as `migrate`, plus REDIS_URL.
      DATABASE_URL: postgres://${POSTGRES_USER:-scry}:${POSTGRES_PASSWORD:-scry}@postgres:5432/${POSTGRES_DB:-scry}
      REDIS_URL: redis://redis:6379
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    restart: unless-stopped
    env_file: ../../.env
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  scry-postgres-data:
  scry-redis-data:
