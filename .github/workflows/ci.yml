name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  e2e:
    # The whole stack against the demo data: API suites (auth modes, security,
    # merging, streaming, audit) and browser suites. See tests/e2e/README.md.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: valkey/valkey:9.0-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # The same stock image the compose files and Helm chart deploy.
      - name: Start Postgres (pgvector)
        run: |
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_USER=scry -e POSTGRES_PASSWORD=scry -e POSTGRES_DB=scry \
            pgvector/pgvector:0.8.6-pg18
          for i in $(seq 1 60); do docker exec postgres pg_isready -U scry && break; sleep 2; done

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build
        run: pnpm build

      - name: Install Playwright's Chromium
        run: pnpm --filter @scry/e2e exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
            tests/e2e/.stack/*.log
          retention-days: 7
